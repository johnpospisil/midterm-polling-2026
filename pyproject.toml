[project]
name = "mp"
version = "0.1.0"
description = "How wrong were the polls? Bias, variance and herding in the 2026 midterms."
authors = [
    { name = "johnpospisil", email = "audiofreak7@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "plotly>=7.1.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "scipy>=1.18.1",
    "tenacity>=9.2.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
